name: Workspace CPU

on:
  push:
    branches: [develop]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'scripts/**', 'benches/runtime/**', 'experiments/model-research/**', 'experiments/bindings-research/**', '.github/workflows/contracts.yml']
  pull_request:
    branches: [develop]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'scripts/**', 'benches/runtime/**', 'experiments/model-research/**', 'experiments/bindings-research/**', '.github/workflows/contracts.yml']

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  runtime-loader-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
      - name: Build one same-HEAD model-free runtime loader diagnostic (CPU2 only)
        id: loader
        shell: bash
        env:
          RZ_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -I -S -B scripts/ci_native_bundle.py --profile runtime-loader-only --expected-head "$RZ_EXPECTED_HEAD" --timeout 3600 --output-root "$RUNNER_TEMP/RoveZero/runtime-loader-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve loader-only ELF, source provenance and closed command logs
        if: always() && steps.loader.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-loader-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/RoveZero/runtime-loader-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
  native-validation-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
      - name: Build same-HEAD release validation bundle (CPU2, no neural work)
        id: bundle
        shell: bash
        env:
          RZ_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -I -S -B scripts/ci_native_bundle.py --expected-head "$RZ_EXPECTED_HEAD" --timeout 10800 --output-root "$RUNNER_TEMP/RoveZero/native-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Preserve bounded binaries and source metadata for local validation
        if: always() && steps.bundle.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-validation-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/RoveZero/native-validation-${{ github.run_id }}-${{ github.run_attempt }}/artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
  bindings-cpu-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Build and check isolated research facade
        shell: bash
        run: |
          python scripts/run_managed.py --timeout 600 -- bash -c '
            set -euo pipefail
            python -m venv --copies "$TMPDIR/bindings-venv"
            source "$TMPDIR/bindings-venv/bin/activate"
            python -m pip install maturin==1.15.0
            cd experiments/bindings-research
            cargo fmt --all -- --check
            cargo test --locked -p rz-bindings-core
            cargo build --release --locked -p rz-bindings-core
            python -m maturin develop --release --locked
            RZ_BINDINGS_CLI="$CARGO_TARGET_DIR/release/rz-bindings-core" python check_paths.py -q
            cargo clippy --all-targets --locked -- -D warnings
          '
  pals-model-cpu-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
      - name: Prepare exact Rules descriptor
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/RoveZero/reports"
          python scripts/run_managed.py --timeout 300 -- cargo run --locked -p rz-uci --example pals_rules_descriptor --quiet > "$RUNNER_TEMP/RoveZero/reports/pals-rules.json"
      - name: Check frozen PALS forward and zero-step preparation
        shell: bash
        run: |
          python scripts/run_managed.py --timeout 780 -- python scripts/pals_model_validate.py --output "$RUNNER_TEMP/RoveZero/reports/pals-model" --layout shared_pc_if --rules-profile-json "$RUNNER_TEMP/RoveZero/reports/pals-rules.json"
      - name: Preserve compact CPU evidence in job log
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/RoveZero/reports/pals-model/validation.json"; then
            cat "$RUNNER_TEMP/RoveZero/reports/pals-model/validation.json"
          fi
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      # The all-feature test image exceeded the production identity byte bound.
      # Reduce CI debug data; keep the guard and the test selection intact.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Register exact Python executable for metadata-only wire checks
        run: python -I -S -c "import os,sys; f=open(os.environ['GITHUB_ENV'],'a',encoding='utf-8'); f.write('RZ_ROVENT_METADATA_PYTHON='+sys.executable+'\n'); f.close()"
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: python scripts/run_managed.py -- cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: python scripts/run_managed.py -- cargo test --workspace --all-targets --all-features --locked
      - name: Check current-thread affinity owner cannot cross threads
        run: python scripts/run_managed.py -- cargo test -p rz-platform --doc --locked
      - name: Check runtime affinity owner cannot cross threads
        run: python scripts/run_managed.py -- cargo test -p rz-runtime --doc --locked
      - name: Check default-feature CLI refusal before native loading
        run: python scripts/run_managed.py -- cargo test -p rz-uci --bin rz-uci --locked
      - name: Check frozen replay caller without native feature
        run: python scripts/run_managed.py -- cargo test -p rz-uci --example pals_frozen_replay --locked
      - run: python scripts/run_managed.py -- cargo test -p rz-uci --test native_cli --locked
      - run: python -m pip install python-chess==1.999 chess==1.11.2
      - run: python scripts/run_managed.py -- cargo test --release -p rz-position --all-features --locked -- --include-ignored
        env:
          RZ_CHESS_PYTHON: python
      - run: python scripts/run_managed.py -- python -m unittest discover -s experiments/model-research/tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}/experiments/model-research/src
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python scripts/run_managed.py -- python -m unittest discover -s benches/runtime/tests -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python scripts/run_managed.py -- python -m unittest discover -s scripts/tests -q
