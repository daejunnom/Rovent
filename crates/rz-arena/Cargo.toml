[package]
name = "rz-arena"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "RoveZero paired opening plans and attempt/failure ledger"

[features]
test-fixtures = []
experimental-snapshot-io = []
experimental-snapshot-reclaim = []
pals-collection = ["dep:rz-uci"]
pals-collection-onnx = ["pals-collection", "rz-uci/onnx-cpu", "rz-uci/pals-adaptive", "rz-experiments/pals-content-admission"]
native-cuda = ["dep:rz-uci", "rz-uci/onnx-cuda", "rz-experiments/pals-content-admission"]
native-validation-diagnostics = ["rz-uci/pals-adaptive-diagnostics", "rz-uci/native-validation-diagnostics"]
native-cuda-batch = ["native-cuda", "rz-uci/experimental-batch", "rz-eval/experimental-batch"]
pals-followup-cuda-warm = ["native-cuda", "rz-uci/experimental-io-binding", "rz-eval/experimental-io-binding"]

[[test]]
name = "collection_v2_contention"
path = "tests/collection_v2_contention.rs"
harness = false
required-features = ["pals-collection-onnx", "test-fixtures"]

[[bin]]
name = "rz-arena-fixture-engine"
path = "src/bin/fixture-engine.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "rz-rovent-trainer"
path = "src/bin/rovent-trainer.rs"
required-features = ["pals-collection-onnx"]

[[bin]]
name = "rz-rovent-utility-trainer"
path = "src/bin/rovent-utility-trainer.rs"
required-features = ["pals-collection-onnx"]

[[bin]]
name = "rz-pals-generation-game-worker"
path = "src/bin/pals-generation-game-worker.rs"
required-features = ["pals-collection-onnx"]

[[bin]]
name = "rz-pals-selfplay-collect"
path = "src/bin/pals-selfplay-collect.rs"
required-features = ["pals-collection-onnx"]

[[bin]]
name = "rz-pals-collect-action-outcomes"
path = "src/bin/pals-action-outcomes.rs"
required-features = ["pals-collection-onnx"]

[[bin]]
name = "rz-pals-generation-pipeline"
path = "src/bin/pals-generation-pipeline.rs"
required-features = ["pals-collection-onnx"]

[[bin]]
name = "rz-pals-g0-numerical"
path = "src/bin/pals-g0-numerical.rs"
required-features = ["pals-collection-onnx"]

[[bin]]
name = "rz-pals-g0-bootstrap-numerical"
path = "src/bin/pals-g0-bootstrap-numerical.rs"
required-features = ["pals-collection-onnx"]

[[bin]]
name = "rz-pals-g0-collection-deployment-numerical"
path = "src/bin/pals-g0-collection-deployment-numerical.rs"
required-features = ["pals-collection-onnx"]

[[bin]]
name = "rz-rovent-collect"
path = "src/bin/rovent-collect.rs"
required-features = ["pals-collection-onnx"]

[[bin]]
name = "rz-rovent-native"
path = "src/bin/rovent-native.rs"
required-features = ["pals-collection-onnx"]

[[example]]
name = "pilot_failure_audit"
required-features = ["native-cuda"]

[[example]]
name = "native_batch_prepare"
required-features = ["native-cuda-batch"]

[[example]]
name = "pals_collect"
required-features = ["pals-collection"]

[dependencies]
rz-experiments = { workspace = true, features = ["pals-content-types"] }
rz-contracts.workspace = true
rz-eval.workspace = true
rz-native-loader.workspace = true
rz-search.workspace = true
rz-position = { workspace = true, features = ["contracts"] }
rz-uci = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
signal-hook.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true
