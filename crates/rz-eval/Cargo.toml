[package]
name = "rz-eval"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "RoveZero model evaluation and deterministic backend test support"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rz-encoding.workspace = true
rz-telemetry.workspace = true
sha2.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic", "cuda"], optional = true }
rz-native-loader = { workspace = true, optional = true }
rz-contracts = { workspace = true, optional = true }
rz-position = { workspace = true, optional = true, features = ["contracts"] }
rz-runtime = { workspace = true, optional = true, features = ["contracts"] }

[features]
experimental-batch = ["contracts", "rz-runtime/experimental-batch"]
# Explicit GPU lifetime validation; no observer exists unless enabled before use.
native-validation-diagnostics = ["onnx", "contracts"]
experimental-io-buffers = ["onnx"]
experimental-ort-cpu-arena = ["onnx"]
experimental-ort-model = ["onnx"]
experimental-io-binding = ["onnx", "rz-native-loader/ort-bindings"]
experimental-cuda-graph = ["experimental-io-binding"]
experimental-notify = ["dep:rz-runtime", "rz-runtime/experimental-notify"]
# Hash the exact owned ONNX bytes during their bounded read; independent E trial.
experimental-onnx-read-hash = []
default = []
onnx = ["dep:ort", "dep:rz-native-loader"]
contracts = ["dep:rz-contracts", "dep:rz-position", "dep:rz-runtime"]
# Independent OPT-01 experiments; original projection remains available.
experimental-bitboards = ["contracts"]
experimental-history-frames = ["contracts"]
experimental-prepared-input = ["contracts"]
experimental-input-hash = ["contracts"]
experimental-raw-cache = ["contracts", "rz-runtime/experimental-raw-cache"]
# Independent E trials; defaults and the public f32 head API remain unchanged.
experimental-policy-buffer = ["contracts"]
experimental-projection-frames = ["contracts"]

[[example]]
name = "maia_check"
required-features = ["onnx"]

[[example]]
name = "inference_bench"
required-features = ["onnx"]

[[example]]
name = "pals_model_check"
required-features = ["onnx", "contracts"]

[[example]]
name = "runtime_loader_check"
required-features = ["onnx"]

[[example]]
name = "virtual_review_numeric_capture"
required-features = ["onnx", "contracts"]

[dev-dependencies]
rz-experiments.workspace = true

[[example]]
name = "device_packing_graph_check"
required-features = ["onnx", "contracts"]

[[example]]
name = "ort_export"
required-features = ["experimental-ort-model"]

[[example]]
name = "rules_maia_check"
required-features = ["onnx", "contracts"]
