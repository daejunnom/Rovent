[package]
name = "rz-uci"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "RoveZero UCI parser and injected session control boundary"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rz-pals-adaptive"
path = "src/bin/pals-adaptive.rs"
required-features = ["pals-adaptive", "onnx-cpu"]

[[bin]]
name = "rz-rovent"
path = "src/bin/rovent.rs"
required-features = ["pals-adaptive", "onnx-cpu"]

[[example]]
name = "search_probe"
required-features = ["onnx-cpu"]

[[example]]
name = "mock_adapter_check"
required-features = ["onnx-cpu"]

[[example]]
name = "pals_cpu_task"
required-features = ["search-work-receipts"]

[[example]]
name = "pals_private_warm_cpu_check"
required-features = ["onnx-cpu"]

[[example]]
name = "pals_continuation_diagnostic"
required-features = ["pals-adaptive-diagnostics"]

[[example]]
name = "virtual_review_warm_numeric_capture"
required-features = ["pals-adaptive", "onnx-cpu", "experimental-io-binding"]

[[example]]
name = "virtual_review_gpu_inflight_validation"
required-features = ["pals-adaptive", "onnx-cuda", "experimental-io-binding", "native-validation-diagnostics"]

[[example]]
name = "rovent_external_probe"
required-features = ["pals-adaptive"]

[features]
experimental-batch = ["rz-search/experimental-batch", "rz-eval/experimental-batch"]
experimental-io-buffers = ["rz-eval/experimental-io-buffers"]
experimental-io-binding = ["rz-eval/experimental-io-binding"]
experimental-cuda-graph = ["rz-eval/experimental-cuda-graph"]
experimental-notify = ["rz-eval/experimental-notify", "rz-runtime/experimental-notify"]
experimental-onnx-read-hash = ["rz-eval/experimental-onnx-read-hash"]
experimental-policy-buffer = ["rz-eval/experimental-policy-buffer"]
experimental-projection-frames = ["rz-eval/experimental-projection-frames"]
experimental-flat-edges = ["rz-search/experimental-flat-edges"]
experimental-compact-child = ["rz-search/experimental-compact-child"]
experimental-backup-scratch = ["rz-search/experimental-backup-scratch"]
default = []
experimental-best-move = []
experimental-raw-cache = ["rz-eval/experimental-raw-cache"]
onnx-cpu = [
    "rz-eval/onnx", "search-work-receipts", "dep:rz-native-loader",
]
search-work-receipts = ["dep:serde", "dep:serde_json", "dep:cap-std", "dep:cap-fs-ext", "dep:nix"]
onnx-cuda = ["onnx-cpu"]
pals-adaptive = ["dep:rz-experiments", "rz-experiments/pals-content-admission", "search-work-receipts"]
pals-adaptive-diagnostics = ["pals-adaptive", "onnx-cpu"]
native-validation-diagnostics = ["pals-adaptive-diagnostics", "rz-eval/native-validation-diagnostics", "rz-search/nnuec-scalar-diagnostics"]

[dependencies]
rz-search.workspace = true
rz-contracts.workspace = true
rz-position = { workspace = true, features = ["contracts"] }
rz-runtime = { workspace = true, features = ["contracts"] }
rz-eval = { workspace = true, features = ["contracts"] }
rz-encoding.workspace = true
rz-telemetry.workspace = true
rz-experiments = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2.workspace = true
cap-std = { workspace = true, optional = true }
cap-fs-ext = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Safe Linux proc/cgroup filesystem checks and nonblocking observer opens.
nix = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# Keep retained-handle Win32 calls in the existing native FFI owner.
rz-native-loader = { workspace = true, optional = true }
