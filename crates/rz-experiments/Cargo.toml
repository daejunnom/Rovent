[package]
name = "rz-experiments"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "RoveZero E01 input manifests, validation and artifact identity"

[features]
default = []
pals-content-types = ["dep:rz-eval"]
pals-content-admission = ["pals-content-types", "rz-eval/onnx", "rz-eval/contracts"]


[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
rz-contracts.workspace = true
rz-eval = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
